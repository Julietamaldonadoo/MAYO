<!DOCTYPE html>
<html lang="es">
<head>
     <meta charset="utf-8">
     <title>Actividad 1 semana #5 (maquetación web)</title>
     <style>
        body{border:8px solid rgb(93, 123, 255);margin:0;font-family: Arial, Helvetica, sans-serif;}

        footer{background: rgb(199, 205, 252);padding: 20px;text-align: center;margin: 10px; border: 8px solid rgb(93, 123, 255);}
        .header-contenido{display: flex;justify-content: space-between;align-items: center;}
        .header-contenido img{width: 200px;}
     </style>


</head>
<body>
    <header> 
        
        <div class="header-contenido">
            HEADER
        <img src="Flor.jpg" alt="imagen">
        </div>
    </header>
    <nav>
        NAV
    </nav>
    <div class="contenedor">
<section>
    SECTION
</section>
<aside>
    ASIDE
    
</aside>
    </div>
    <footer>
        FOOTER
    </footer>

</html>
